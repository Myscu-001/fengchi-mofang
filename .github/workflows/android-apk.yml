name: Build Android APK

# 为什么放在云端构建：GitHub 的 ubuntu 运行器自带 Android SDK 与 JDK，
# 仓库是 public → Actions 分钟数免费。这样本机不需要装 JDK / SDK / Android Studio。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 打包方式
        type: choice
        options:
          - online
          - bundled
        default: online

  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'capacitor.config.json'
      - 'capacitor.config.bundled.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_MODE: ${{ github.event.inputs.mode || 'online' }}
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 安装前端依赖
        run: npm ci

      - name: 按模式准备配置
        run: |
          echo "打包方式 = $APP_MODE"
          if [ "$APP_MODE" = "bundled" ]; then
            # 本地打包：去掉 server.url，资源从 App 内部读，base 必须是根路径
            cp capacitor.config.bundled.json capacitor.config.json
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            # 在线壳：App 直接打开线上网址
            echo "VITE_BASE=/fengchi-mofang/" >> "$GITHUB_ENV"
          fi
          echo "--- 生效的 capacitor.config.json ---"
          cat capacitor.config.json

      - name: 构建前端
        run: npm run build

      - name: 同步 Web 资源与插件到安卓工程
        run: npx cap sync android

      - name: 准备 Android SDK 组件
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          SDKMGR="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager = $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "platform-tools" > /dev/null 2>&1 || true
          echo "--- 已安装的平台 ---"
          ls "$ANDROID_HOME/platforms" || true

      - name: 打包 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          if [ "$APP_MODE" = "bundled" ]; then
            NAME="fengchi-mofang-bundled.apk"
          else
            NAME="fengchi-mofang-online.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/$NAME"
          ls -lh out

      - name: 上传为 Actions 产物（需登录 GitHub 下载）
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.APP_MODE }}
          path: out/*.apk
          retention-days: 90

      - name: 发布到 Releases（得到固定下载链接，手机免登录）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 风驰思维魔方 · 手机安装包
          body: |
            自动构建的安卓安装包，手机上直接点开下载即可安装。

            - 打包方式：`${{ env.APP_MODE }}`
            - 构建提交：`${{ github.sha }}`
            - 构建时间：${{ github.event.repository.updated_at }}

            > online = 在线壳（页面走线上网址，改网站即刻生效）
            > bundled = 离线版（页面装在 App 内，断网也能打开）
          files: out/*.apk
          overwrite_files: true
          make_latest: false
